        in: header
        name: X-WHR-Recipient
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Unknown recipient
          schema:
            type: string
      summary: Inbound email ingest (internal)
      tags:
      - email
