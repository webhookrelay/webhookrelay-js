          specified in the destination. For example if request is coming to /v1/webhooks/xxx/github-jenkins,
          with lock path 'false' and destination 'http://localhost:8080' it would go to http://localhost:8080/github-jenkins.
          However, with lock path 'true', it will be sent to 'http://localhost:8080'
        type: boolean
      name:
        type: string
      replay_missing:
        allOf:
        - $ref: '#/definitions/structs.ReplayMissingConfig'
        description: |-
          ReplayMissing configures recovery of internal deliveries that were
          persisted as received but never reached an agent. When an agent connects,
          matching rows from the configured lookback window are sent directly to
          that connection, up to Limit. Stored as JSON so the policy can grow
          without a schema migration.
      response_function_id:
        description: |-
