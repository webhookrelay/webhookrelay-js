        description: |-
          Deadline caps how long a queued webhook may wait for delivery,
          measured from when it was received. Zero falls through to
          DefaultThrottleDeadline. Webhooks older than the deadline are dropped
          (marked failed) instead of delivered.
      enabled:
        description: Enabled toggles the whole feature for this output.
        type: boolean
      interval:
        description: |-
          Interval is ThrottleIntervalSecond / Minute / Hour. Used only in
          ThrottleModeRate.
        type: string
      max_concurrent:
        description: |-
          MaxConcurrent is the maximum number of in-flight deliveries. Used
          only in ThrottleModeConcurrency. 1 means serial delivery.
        type: integer
      max_queue_depth:
        description: |-
          MaxQueueDepth bounds how many webhooks may sit in the queue for this
          output. Zero means unbounded. When exceeded, the ingester rejects
          new webhooks with HTTP 429.
        type: integer
      mode:
        description: Mode is ThrottleModeRate or ThrottleModeConcurrency.
        type: string
      rate:
        description: |-
          Rate is the maximum number of deliveries per Interval. Used only in
          ThrottleModeRate.
        type: integer
