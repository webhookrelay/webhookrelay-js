      description: 'Starts one turn and streams its events as server-sent events (text/event-stream):
        meta, text_delta, text, tool_call, tool_result, refused, usage, done. The
        turn keeps running if the client disconnects; re-attach with GET /v1/agent/conversations/{id}/stream.
        The prompt id is an idempotency key.'
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: User message
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/api.AgentMessageRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: event stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: A turn is already running
          schema:
            type: string
        "429":
          description: Monthly token allowance used up
          schema:
            $ref: '#/definitions/api.AgentQuotaExceeded'
      security:
      - BearerAuth: []
      summary: Send a message to the agent
      tags:
      - agent
  /v1/agent/conversations/{id}/steer:
    post:
      consumes:
      - application/json
      description: Cancels the current work and queues a replacement instruction on
        the same conversation
