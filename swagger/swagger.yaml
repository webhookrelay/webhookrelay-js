        "409":
          description: The idempotency key was used for a different message
          schema:
            $ref: '#/definitions/api.outboundErrorResponse'
        "413":
          description: The payload exceeds 256 KiB
          schema:
            $ref: '#/definitions/api.outboundErrorResponse'
        "429":
          description: Too many messages are still waiting to be enqueued
          schema:
            $ref: '#/definitions/api.outboundErrorResponse'
