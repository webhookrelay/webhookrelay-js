host: my.webhookrelay.com
info:
  contact:
    email: info@webhookrelay.com
    name: WebhookRelay support
    url: https://my.webhookrelay.com/
  description: This is the WebhookRelay API.
  title: WebhookRelay API reference
  version: "0.1"
paths:
  /v1/account:
    get:
      consumes:
      - application/json
      description: Get the effective account (the organization account when acting
        through the X-Org-ID override)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.Account'
      security:
      - BearerAuth: []
      summary: Get current account
      tags:
      - account
    put:
      consumes:
      - application/json
      description: Update account settings, including quota notification thresholds
        and up to 10 additional validated email recipients, plus the organization
        profile. Organization fields are optional. Converting to an organization is
        one-way (the flag can never be unset) and only the account owner can do it
        — not org admins acting through the override. The logo must be a small data:image/...;base64
        payload.
      parameters:
      - description: Account changes
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/api.updateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Update account
      tags:
      - account
  /v1/account/api-key:
    get:
      consumes:
      - application/json
      description: Get the account API key. If no key exists, a new one will be generated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.AccountAPIKey'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get account API key
      tags:
      - account
    post:
      consumes:
      - application/json
      description: Generate a new API key for the account, replacing the existing
        one.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.AccountAPIKey'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Regenerate account API key
      tags:
      - account
    put:
      consumes:
      - application/json
      description: Enable or disable the account API key without regenerating it.
      parameters:
      - description: API key status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/structs.UpdateAPIKeyStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.UpdateAPIKeyStatusResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Enable or disable account API key
      tags:
      - account
  /v1/account/audit:
    get:
      consumes:
      - application/json
      description: 'Audit entries for the effective account: who did what (owners,
        org members, sub-accounts). Restricted to the owner and org admins.'
      parameters:
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: Comma-separated resource kinds
        in: query
