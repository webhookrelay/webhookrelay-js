definitions:
  agent.AdminConversation:
    properties:
      account_id:
        type: string
      approvals:
        description: |-
          Approvals is how many destructive calls asked the user; Denied counts
          those declined, expired or cancelled (anything that did not run).
        type: integer
      approvals_approved:
        type: integer
      approvals_denied:
        type: integer
      approved_scopes:
        description: |-
          ApprovedScopes are the harness scopes the user widened this
          conversation by ("routing:drop"), space separated. Approvals outlive
          a turn: each turn is its own session, so the widening is replayed on
          top of the role's grant when the next turn starts.
        type: string
      cache_hit_rate:
        type: number
      cache_miss_cost_usd:
        type: number
      cache_read_tokens:
        type: integer
      cache_write_tokens:
        type: integer
      context_id:
        type: string
      context_kind:
        description: |-
          ContextKind / ContextID name the page the conversation was opened
          from: "function" + a function ID for the function details page.
        type: string
      created_at:
        type: string
      created_by:
        description: |-
          CreatedBy is the acting member in an organization context, the
          account itself otherwise.
        type: string
      email:
        type: string
      grant:
        description: Grant is the harness grant label the conversation runs under.
        type: string
      grant_label:
        type: string
      id:
        type: string
      input_tokens:
        type: integer
      iterations:
        type: integer
      last_message_at:
        type: string
      last_stop_cause:
        type: string
      model_calls:
        type: integer
      model_failures:
        type: integer
      model_latency_ms:
        type: integer
      output_tokens:
        type: integer
      page:
        description: |-
          Page is a human label for where the chat was opened from ("Buckets",
          "Bucket orders", "Access Tokens"), so the agent knows what the user is
          looking at even when there is no resource to bind to.
        type: string
      provider:
        type: string
      session_turns:
        type: integer
      thumbs_down:
        type: integer
      thumbs_up:
        type: integer
      title:
        type: string
      tool_calls:
        type: integer
      turns:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  agent.AdminDetail:
    properties:
      approvals:
        items:
          $ref: '#/definitions/structs.AgentApproval'
        type: array
      conversation:
        $ref: '#/definitions/agent.AdminConversation'
      feedback:
        items:
          $ref: '#/definitions/structs.AgentFeedback'
        type: array
      inferences:
        items:
          $ref: '#/definitions/sessionstore.InferenceRecord'
        type: array
      messages:
        items:
          $ref: '#/definitions/agent.Message'
        type: array
      prompts:
        items:
          $ref: '#/definitions/sessionstore.PromptRecord'
        type: array
      tool_calls:
        items:
          $ref: '#/definitions/sessionstore.ToolCallRecord'
        type: array
      truncated:
        $ref: '#/definitions/agent.AdminEvidenceTruncated'
    type: object
  agent.AdminEvidenceTruncated:
    properties:
      inferences:
        type: boolean
      prompts:
        type: boolean
      tool_calls:
        type: boolean
    type: object
  agent.AdminPage:
    properties:
      items:
        items:
          $ref: '#/definitions/agent.AdminConversation'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  agent.AdminStats:
    properties:
      accounts:
        type: integer
      approvals_approved:
        type: integer
      approvals_asked:
        description: 'Approvals: destructive calls that paused for the user, by outcome.'
        type: integer
      approvals_denied:
        type: integer
      approvals_expired:
        type: integer
      approvals_pending:
        type: integer
      avg_model_latency_ms:
        type: number
      cache_hit_rate:
        type: number
      cache_miss_cost_usd:
        type: number
      cache_read_tokens:
        type: integer
      conversations:
        type: integer
      daily:
        items:
          $ref: '#/definitions/agent.DailyStat'
        type: array
      input_tokens:
        type: integer
      model_calls:
        type: integer
      model_failures:
        type: integer
      output_tokens:
        type: integer
      pages:
        items:
          $ref: '#/definitions/agent.NamedCount'
        type: array
      stop_causes:
        items:
          $ref: '#/definitions/agent.NamedCount'
        type: array
      thumbs_down:
        type: integer
      thumbs_up:
        type: integer
      tool_calls:
        type: integer
      tool_failures:
        type: integer
      tool_refusals:
        type: integer
      top_tools:
        items:
          $ref: '#/definitions/agent.ToolStat'
        type: array
      turns:
        type: integer
    type: object
  agent.AttachmentView:
    properties:
      bytes:
        type: integer
      media_type:
        type: string
      name:
        type: string
    type: object
  agent.DailyStat:
    properties:
      conversations:
        type: integer
      day:
        type: string
      tool_calls:
        type: integer
      turns:
        type: integer
    type: object
  agent.Message:
    properties:
      attachments:
        items:
          $ref: '#/definitions/agent.AttachmentView'
        type: array
      role:
        type: string
      text:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/agent.ToolCallView'
        type: array
      tool_results:
        items:
          $ref: '#/definitions/agent.ToolResultView'
        type: array
    type: object
  agent.NamedCount:
    properties:
      count:
        type: integer
      name:
        type: string
    type: object
  agent.Page:
    properties:
      focus_id:
        type: string
      focus_kind:
        description: |-
          FocusKind/FocusID name the resource the page shows: the output, input
          or webhook log of the bucket the user has open, an incident, an alert
          policy, or an outbound consumer, endpoint or message.
        type: string
      id:
        type: string
      kind:
        type: string
      label:
        type: string
    type: object
  agent.Quota:
    properties:
      limit:
        type: integer
      resets_at:
        description: ResetsAt is when the next month's allowance starts.
        type: string
      unlimited:
        description: Unlimited plans have no cap; Used still counts.
        type: boolean
      used:
        description: Used and Limit are model tokens (input + output) this calendar
          month.
        type: integer
    type: object
  agent.ToolCallView:
    properties:
      id:
        type: string
      input:
        type: object
      name:
        type: string
    type: object
  agent.ToolInfo:
    properties:
      approvable:
        type: boolean
      description:
        type: string
      name:
        type: string
      needs:
        type: string
      permitted:
        type: boolean
    type: object
  agent.ToolResultView:
    properties:
      call_id:
        type: string
      content:
        type: string
      is_error:
        type: boolean
    type: object
  agent.ToolStat:
    properties:
      avg_ms:
        type: number
      calls:
        type: integer
      failed:
        type: integer
      refused:
        type: integer
      tool:
        type: string
    type: object
  api.AdminAgentLimitValues:
    properties:
      max_iterations:
        type: integer
      max_output_tokens:
        type: integer
      max_tokens_per_turn:
        type: integer
      plan_tokens:
        additionalProperties:
          type: integer
        type: object
    type: object
  api.AdminAgentLimits:
    properties:
      defaults:
        $ref: '#/definitions/api.AdminAgentLimitValues'
      effective:
        $ref: '#/definitions/api.AdminAgentLimitValues'
      overrides:
        $ref: '#/definitions/structs.AgentLimitOverrides'
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  api.AdminAgentLimitsUpdateRequest:
    properties:
      overrides:
        $ref: '#/definitions/structs.AgentLimitOverrides'
    type: object
  api.AdminTrafficStatsResponse:
    properties:
      collectedAt:
        type: string
      snapshots:
        items:
          $ref: '#/definitions/trafficstats.Snapshot'
        type: array
    type: object
  api.AdminUsageAlertsResponse:
    properties:
      alerts:
        items:
          $ref: '#/definitions/structs.AdminUsageAlert'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.AdminUsageBucket:
    properties:
      account_id:
        type: string
      created_at:
        type: integer
      description:
        type: string
      id:
        type: string
      inputs:
        items:
          $ref: '#/definitions/api.AdminUsageInput'
        type: array
      name:
        type: string
      outputs:
        items:
          $ref: '#/definitions/api.AdminUsageOutput'
        type: array
      suspended:
        type: boolean
    type: object
  api.AdminUsageBucketsResponse:
    properties:
      buckets:
        items:
          $ref: '#/definitions/api.AdminUsageBucket'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.AdminUsageInput:
    properties:
      description:
        type: string
      function_id:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  api.AdminUsageOutput:
    properties:
      account_id:
        type: string
      bucket_id:
        type: string
      bucket_name:
        description: |-
          BucketName/AccountID are resolved in the flat outputs listing; the
          buckets listing leaves them empty (the parent row carries them).
        type: string
      created_at:
        type: integer
      destination:
        type: string
      destination_provider:
        description: |-
          DestinationProvider is the classified destination service (jenkins,
          slack, localhost, ...) or "unknown".
        type: string
      disabled:
        type: boolean
      function_id:
        type: string
      id:
        type: string
      internal:
        type: boolean
      name:
        type: string
      response_function_id:
        type: string
    type: object
  api.AdminUsageOutputsResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      outputs:
        items:
          $ref: '#/definitions/api.AdminUsageOutput'
        type: array
      total:
        type: integer
    type: object
  api.AdminUsageSummaryResponse:
    properties:
      collectedAt:
        type: string
      destination_providers:
        additionalProperties:
          type: integer
        description: DestinationProviders is classified-destination -> output count.
        type: object
      disabled_outputs:
        type: integer
      internal_outputs:
        type: integer
      outputs_with_functions:
        description: |-
          OutputsWithFunctions counts outputs with a delivery or response
          function attached.
        type: integer
      total_outputs:
        type: integer
    type: object
  api.AdminUsageWebhookMonth:
    properties:
      month:
        example: 2026-08
        type: string
      webhooks:
        example: 125000
        type: integer
    type: object
  api.AdminUsageWebhooksResponse:
    properties:
      account_id:
        type: string
      from:
        example: "2025-09-01"
        type: string
      months:
        items:
          $ref: '#/definitions/api.AdminUsageWebhookMonth'
        type: array
      to:
        example: "2026-08-30"
        type: string
      total_webhooks:
        type: integer
    type: object
  api.AgentApprovalRequest:
    properties:
      call_id:
        description: CallID is the paused tool call, from the approval_requested event.
        type: string
      remember:
        description: Remember also allows the scope for the rest of the conversation
          (approve).
        type: boolean
      scope:
        description: Scope is the access the call needs, e.g. "routing:drop" (approve).
        type: string
      text:
        description: Text is the reason the agent should hear (deny, optional).
        type: string
    type: object
  api.AgentControlRequest:
    properties:
      scope:
        description: Scope is the harness scope to approve, e.g. "routing:drop" (widen).
        type: string
      text:
        description: Text is the steering instruction (steer).
        type: string
    type: object
  api.AgentConversationDetail:
    properties:
      active:
        type: boolean
      approvals:
        description: |-
          Approvals are the destructive calls the agent asked about in this
          conversation and what the user answered, so a reopened chat still
          shows who allowed what.
        items:
          $ref: '#/definitions/structs.AgentApproval'
        type: array
      conversation:
        $ref: '#/definitions/structs.AgentConversation'
      feedback:
        items:
          $ref: '#/definitions/structs.AgentFeedback'
        type: array
      messages:
        items:
          $ref: '#/definitions/agent.Message'
        type: array
    type: object
  api.AgentConversationRequest:
    properties:
      context_id:
        type: string
      context_kind:
        type: string
      page:
        description: Page labels where the chat was opened ("Buckets", "Access Tokens").
        type: string
      title:
        type: string
    type: object
  api.AgentFeedbackRequest:
    properties:
      comment:
        type: string
      excerpt:
        type: string
      message_index:
        type: integer
      rating:
        description: up | down
        type: string
    type: object
  api.AgentMessageRequest:
    properties:
      id:
        type: string
      page:
        allOf:
        - $ref: '#/definitions/agent.Page'
        description: |-
          Page is where the user is when sending (kind, id, label), so a chat
          that follows them across the dashboard still knows what they see.
      text:
        type: string
    type: object
  api.AgentQuotaExceeded:
    properties:
      code:
        type: string
      error:
        type: string
      quota:
        $ref: '#/definitions/agent.Quota'
    type: object
  api.AgentStatus:
    properties:
      enabled:
        type: boolean
      grant:
        type: string
      model:
        type: string
      playbooks:
        items:
          type: string
        type: array
      quota:
        allOf:
        - $ref: '#/definitions/agent.Quota'
        description: Quota is the plan's shared account-agent and managed-Function
          AI token allowance.
      scopes:
        items:
          type: string
        type: array
    type: object
  api.AgentToolsResponse:
    properties:
      tools:
        items:
          $ref: '#/definitions/agent.ToolInfo'
        type: array
    type: object
  api.EnterprisePlanMetadataField:
    properties:
      aliases:
        items:
          type: string
        type: array
      description:
        type: string
      group:
        type: string
      key:
        type: string
      label:
        type: string
      minimum:
        type: number
      type:
        enum:
        - integer
        - number
        - boolean
        type: string
      unit:
        type: string
    type: object
  api.EnterprisePlanMetadataSchemaResponse:
    properties:
      fields:
        items:
          $ref: '#/definitions/api.EnterprisePlanMetadataField'
        type: array
    type: object
  api.Response:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  api.ServerConfig:
    properties:
      email_inbound_address_template:
        description: |-
          EmailInboundAddressTemplate is the canonical inbound-email address format,
          e.g. "{token}@in.webhookrelay-mail.com". The backend is the single source
          of truth for the address shape so the UI and API render addresses
          consistently instead of hardcoding the "{token}@<domain>" join — substitute
          an email input's id for "{token}". Empty when inbound email is not
          configured.
        type: string
      email_inbound_domain:
        description: |-
          EmailInboundDomain is the inbound-email domain ({local-part}@<domain>)
          addresses are built on for this environment ("in.webhookrelay-mail.com" in
          production, "dev.webhookrelay-mail.com" in development). Empty when inbound
          email is not configured, which the UI uses to hide the email-input feature.
        type: string
      email_inbound_enabled:
        description: |-
          EmailInboundEnabled reports whether the inbound email endpoint is wired up
          (a shared secret is provisioned).
        type: boolean
      turnstile_disabled:
        type: boolean
      version:
        type: string
    type: object
  api.accessTokenCreateResponse:
    properties:
      key:
        type: string
      secret:
        type: string
    type: object
  api.accountAuditResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/structs.AuditLog'
        type: array
      total:
        type: integer
    type: object
  api.actionLogRequest:
    properties:
      action:
        type: string
      output:
        description: output ID, if not specified defaults to original output
        type: string
      process_policy:
        description: skip/force
        type: string
    type: object
  api.adminAccountIdentityUpdateRequest:
    properties:
      auth_type:
        $ref: '#/definitions/structs.AccountAuthType'
      email:
        type: string
    type: object
  api.adminAccountSearchResult:
    properties:
      active:
        type: boolean
      auth_type:
        $ref: '#/definitions/structs.AccountAuthType'
      company_name:
        type: string
      created_at:
        type: integer
      email:
        type: string
      email_verified:
        type: boolean
      first_name:
        type: string
      id:
        type: string
      last_login_at:
        type: integer
      last_name:
        type: string
      organization:
        type: boolean
      plan_id:
        type: string
      subscription_meta:
        $ref: '#/definitions/structs.Metadata'
      username:
        type: string
    type: object
  api.adminAccountStatus:
    properties:
      account_id:
        type: string
      bucket_count:
        type: integer
      current_period_end:
        type: integer
      current_period_start:
        type: integer
      effective_metadata:
        $ref: '#/definitions/structs.PlanMeta'
      plan_id:
        type: string
      plan_metadata:
        $ref: '#/definitions/structs.Metadata'
      subscription_created:
        type: integer
      subscription_extras:
        items:
          $ref: '#/definitions/structs.SubscriptionExtras'
        type: array
      subscription_metadata:
        $ref: '#/definitions/structs.Metadata'
      subscription_status:
        type: string
      suspend_protection:
        type: boolean
      suspended_bucket_count:
        type: integer
    type: object
  api.adminBucketSuspensionResponse:
    properties:
      affected:
        type: integer
      suspended:
        type: boolean
      total:
        type: integer
    type: object
  api.adminBucketSuspensionUpdateRequest:
    properties:
      suspended:
        type: boolean
    type: object
  api.adminOrganizationDetails:
    properties:
      members:
        items:
          $ref: '#/definitions/structs.OrganizationMemberDetails'
        type: array
      organization:
        $ref: '#/definitions/api.adminOrganizationSummary'
      sub_accounts:
        items:
          $ref: '#/definitions/structs.SubAccount'
        type: array
    type: object
  api.adminOrganizationMemberCreateRequest:
    properties:
      account_id:
        type: string
      email:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  api.adminOrganizationMemberUpdateRequest:
    properties:
      role:
        type: string
    type: object
  api.adminOrganizationSummary:
    properties:
      active:
        type: boolean
      created_at:
        type: integer
      email:
        type: string
      id:
        type: string
      member_count:
        type: integer
      organization_description:
        type: string
      organization_name:
        type: string
      plan_id:
        type: string
      sub_account_count:
        type: integer
      username:
        type: string
    type: object
  api.adminOrganizationUpdateRequest:
    properties:
      organization_description:
        type: string
      organization_name:
        type: string
    type: object
  api.adminRecentAccount:
    properties:
      active:
        type: boolean
      auth_type:
        $ref: '#/definitions/structs.AccountAuthType'
      company_name:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      organization:
        type: boolean
      plan_id:
        type: string
      use_case:
        type: string
      username:
        type: string
    type: object
  api.adminRecentAccountsResponse:
    properties:
      accounts:
        items:
          $ref: '#/definitions/api.adminRecentAccount'
        type: array
      created_after:
        type: string
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.adminSubAccountCreateRequest:
    properties:
      auth_type:
        $ref: '#/definitions/structs.AccountAuthType'
      email:
        type: string
      username:
        type: string
    type: object
  api.adminSuspendProtectionUpdateRequest:
    properties:
      enabled:
        type: boolean
    type: object
  api.auditLogsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/structs.AuditLog'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  api.bindFunctionConnectionRequest:
    properties:
      service_connection_id:
        type: string
    type: object
  api.createAccessTokenRequest:
    properties:
      api_access:
        type: string
      description:
        type: string
      name:
        type: string
      permissions:
        $ref: '#/definitions/structs.TokenPermissions'
      scopes:
        $ref: '#/definitions/api.tokenScopes'
    type: object
  api.createManagedCertRequest:
    properties:
      domain:
        type: string
      name:
        type: string
      options:
        additionalProperties:
          type: string
        type: object
      provider:
        type: string
    type: object
  api.creatorIdentity:
    properties:
      avatar_url:
        type: string
      id:
        type: string
      kind:
        type: string
      username:
        type: string
    type: object
  api.deletedResponse:
    properties:
      deleted:
        type: boolean
    type: object
  api.endpointWithSecret:
    properties:
      auto_disable:
        type: boolean
      consecutive_failures:
        type: integer
      consumer:
        type: string
      created_at:
        type: string
      description:
        type: string
      event_types:
        items:
          type: string
        type: array
      failing_since:
        type: string
      function_id:
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      previous_secret_expires_at:
        type: string
      rate:
        type: integer
      secret:
        type: string
      state:
        enum:
        - active
        - failing
        - paused
        - disabled
        type: string
      timeout:
        description: seconds; zero uses OutboundDefaultTimeout
        type: integer
      updated_at:
        type: string
      url:
        type: string
    type: object
  api.eventResponse:
    properties:
      has_more:
        type: boolean
      logs:
        items:
          $ref: '#/definitions/structs.Log'
        type: array
    type: object
  api.listPlanOptionalItemsResponse:
    properties:
      plans:
        items:
          $ref: '#/definitions/api.planOptionalItems'
        type: array
    type: object
  api.loginResponse:
    properties:
      mfa_required:
        type: boolean
      mfa_token:
        type: string
      token:
        type: string
    type: object
  api.logsHistogramBucketJSON:
    properties:
      counts:
        additionalProperties:
          type: integer
        type: object
      latency_ms_avg:
        type: number
      max_retries:
        type: integer
      minute:
        type: integer
      retried:
        description: |-
          Retry-pressure overlay. With durable delivery on, latest-status
          alone drifts to "all sent"; these counters keep outages visible
          in the chart. See design §6.10.9.
        type: integer
      retry_count:
        type: integer
      total:
        type: integer
    type: object
  api.logsHistogramResponse:
    properties:
      buckets:
        items:
