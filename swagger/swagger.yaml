    get:
      consumes:
      - application/json
      description: 'Pull-based delivery: returns the oldest unsent webhooks for the
        bucket and marks them delivered (RECEIVED → SENT), so each poll returns the
        next batch and drains to an empty page. Report a different outcome with PUT
        /v1/logs/{id}.'
      parameters:
      - description: Bucket ID or account-unique name
        in: query
        name: bucket
        required: true
        type: string
      - description: Output ID filter
        in: query
        name: output
        type: string
      - description: Page size (default 1, max 100)
        in: query
        name: limit
        type: integer
      - description: How far back to look for unsent webhooks (default 24h, Go duration
          syntax)
        in: query
        name: max_age
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.eventResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: bucket not found
          schema:
            type: string
        "503":
          description: turbostore v2 is not enabled
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Consume webhook events (pull-delivery queue)
      tags:
      - logs
